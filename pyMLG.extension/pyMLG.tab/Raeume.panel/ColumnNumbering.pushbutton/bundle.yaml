title:
  de_de: "Elemente\nnummerieren"
  en_us: "Number\nElements"
  es_es: "Numerar\nelementos"
author: pyMLG
tooltip:
  de_de: >-
    Nummeriert Elemente beliebiger Kategorien - z. B. Stützen nach dem Plan des Statikers, Türen, Räume oder Wände. Die letzte Zahl der ersten Nummer wird hochgezählt (S-01, S-02 ...).

    Anklicken: Elemente nacheinander in der Reihenfolge des Plans anklicken, ESC beendet. Pfad-Linie: Modell- oder Detaillinien durch die Elemente zeichnen und wählen - nummeriert wird in Zeichenrichtung (Schlangenlinie oder eine Linie je Reihe).

    Die Kategorien werden im Fenster gewählt (nur solche mit Elementen im Projekt). Die Nummern erscheinen während des Laufs als Vorschau in der Ansicht; am Ende übernehmen oder alles verwerfen. Optional bekommen Elemente derselben Kategorie darüber und darunter dieselbe Nummer (nicht bei Wänden, Trägern u. ä.). Ein Rückgängig-Schritt je Lauf.

    Benötigt die CPython3-Engine.
  en_us: >-
    Numbers elements of any category - e.g. columns according to the structural engineer's plan, doors, rooms or walls. The last number of the first number is counted up (S-01, S-02 ...).

    Pick: pick the elements one after another in the order of the plan, ESC ends. Path line: draw model or detail lines through the elements and pick them - numbering follows the drawing direction (a snake line or one line per row).

    The categories are chosen in the window (only those with elements in the project). The numbers are previewed in the view while you work; at the end keep them or discard everything. Optionally, elements of the same category above and below get the same number (not for walls, beams etc.). One undo step per run.

    Requires the CPython3 engine.
  es_es: >-
    Numera elementos de cualquier categoría, p. ej. pilares según el plano del ingeniero de estructuras, puertas, habitaciones o muros. Se incrementa el último número del primer número (S-01, S-02 ...).

    Seleccionar: seleccione los elementos uno tras otro en el orden del plano, ESC termina. Línea de recorrido: dibuje líneas de modelo o de detalle a través de los elementos y selecciónelas; se numera en el sentido del dibujo (una línea en zigzag o una línea por fila).

    Las categorías se eligen en la ventana (solo las que tienen elementos en el proyecto). Los números se muestran como vista previa durante el proceso; al final se conservan o se descarta todo. Opcionalmente, los elementos de la misma categoría encima y debajo reciben el mismo número (no en muros, vigas, etc.). Un paso de deshacer por ejecución.

    Requiere el motor CPython3.
