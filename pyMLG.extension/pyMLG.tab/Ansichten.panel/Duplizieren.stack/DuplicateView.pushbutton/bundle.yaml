tooltip:
  de_de: >-
    Dupliziert die im Projektbrowser ausgewählten Ansichten und benennt die Kopien fortlaufend.
  en_us: >-
    Duplicates the views selected in the Project Browser and numbers the copies consecutively.
  es_es: >-
    Duplica las vistas seleccionadas en el navegador de proyectos y numera las copias de forma consecutiva.
