title:
  de_de: "Workset\nCreator"
  en_us: "Workset\nCreator"
  es_es: "Crear\nsubproyectos"
author: pyMLG
tooltip:
  de_de: >-
    Worksets sammeln und in einem Schritt erstellen.

    Namen aus einem geöffneten Projekt, direkt aus einer .rvt-Datei (ohne sie zu öffnen), aus der Zwischenablage oder per Eingabe. Existiert ein Name schon: nicht erstellen oder mit Nummer umbenennen.

    Benötigt die CPython3-Engine.
  en_us: >-
    Collect worksets and create them in one step.

    Names from an open project, directly from an .rvt file (without opening it), from the clipboard or typed in. If a name exists: skip it or rename it with a number.

    Requires the CPython3 engine.
  es_es: >-
    Reúne subproyectos y créalos en un solo paso.

    Nombres de un proyecto abierto, directamente de un archivo .rvt (sin abrirlo), del portapapeles o escritos. Si un nombre ya existe: omitirlo o renombrarlo con un número.

    Requiere el motor CPython3.
