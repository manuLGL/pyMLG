title:
  de_de: "Wohnungen\nnummerieren"
  en_us: "Number\nApartments"
  es_es: "Numerar\nviviendas"
author: pyMLG
tooltip:
  de_de: >-
    Nummeriert Wohnungsgruppen (Modellgruppen mit Typname WHG_TYP ...) entlang einer Linie über mehrere Geschosse und füllt die Parameter aller Räume in der Gruppe.

    Im Fenster BAUTEIL und STIEGE eintragen, die erste TOP-Nummer angeben und die Geschosse wählen. Dann Modell- oder Detaillinien durch die Wohnungen zeichnen und wählen (vorher markieren oder danach anklicken, ESC beendet). Gezählt wird von unten nach oben, in jedem Geschoss in Zeichenrichtung der Linie, ohne Neubeginn; führende Nullen bleiben (01, 02 ...). Eine Wohnung zählt, sobald die Linie durch einen ihrer Räume geht.

    Aus dem Typnamen, z. B. "WHG_TYP A2a - TU_OG07-OG12": GRUPPE_TYP = ganzer Name, TOP_ID_Typname = A2a, TOP_ID_Kategorie = A-TYP, TOP_ID_Geschoss = OG07-OG12. Gruppen mit anderem Namensschema werden übersprungen und gemeldet. Ist bei einem Parameter "Werte je nach Gruppeninstanz unterschiedlich" aus, fragt das Werkzeug, ob es die Einstellung einschalten soll - Gruppen werden nie aufgelöst. Am Ende behalten oder alles verwerfen - ein Rückgängig-Schritt.

    Benötigt die CPython3-Engine.
  en_us: >-
    Numbers apartment groups (model groups with type name WHG_TYP ...) along a line across several levels and fills the parameters of all rooms in the group.

    In the window enter BAUTEIL and STIEGE, give the first TOP number and choose the levels. Then draw model or detail lines through the apartments and pick them (select them beforehand or pick them afterwards, ESC ends). Counting goes from bottom to top, on each level in the drawing direction of the line, without restarting; leading zeros are kept (01, 02 ...). An apartment counts as soon as the line passes through one of its rooms.

    From the type name, e.g. "WHG_TYP A2a - TU_OG07-OG12": GRUPPE_TYP = full name, TOP_ID_Typname = A2a, TOP_ID_Kategorie = A-TYP, TOP_ID_Geschoss = OG07-OG12. Groups with a different naming scheme are skipped and reported. If "Values can vary by group instance" is off for a parameter, the tool asks whether to turn it on - groups are never ungrouped. At the end keep or discard everything - one undo step.

    Requires the CPython3 engine.
  es_es: >-
    Numera grupos de vivienda (grupos de modelo con nombre de tipo WHG_TYP ...) a lo largo de una línea en varios niveles y rellena los parámetros de todas las habitaciones del grupo.

    En la ventana introduzca BAUTEIL y STIEGE, indique el primer número TOP y elija los niveles. Luego dibuje líneas de modelo o de detalle a través de las viviendas y selecciónelas (antes o después, ESC termina). Se cuenta de abajo arriba, en cada nivel en el sentido del dibujo de la línea, sin reiniciar; se conservan los ceros a la izquierda (01, 02 ...). Una vivienda cuenta en cuanto la línea atraviesa una de sus habitaciones.

    Del nombre de tipo, p. ej. "WHG_TYP A2a - TU_OG07-OG12": GRUPPE_TYP = nombre completo, TOP_ID_Typname = A2a, TOP_ID_Kategorie = A-TYP, TOP_ID_Geschoss = OG07-OG12. Los grupos con otro esquema de nombre se omiten y se indican. Si "Los valores pueden variar por instancia de grupo" está desactivado en un parámetro, la herramienta pregunta si debe activarlo; los grupos nunca se desagrupan. Al final se conserva o se descarta todo: un paso de deshacer.

    Requiere el motor CPython3.
